[project]
name = "ai-code-guardian"
version = "2.0.0"
description = "Repository-agnostic AI-powered application security platform: SAST, IaC, dependency, quantum-readiness, and business-intent analysis — 100% local."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "pandas", "openpyxl"]
ai = ["sentence-transformers", "chromadb", "requests"]  # + local Ollama
dev = ["pytest>=7.0"]

[project.scripts]
guardian = "guardian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardian*"]
