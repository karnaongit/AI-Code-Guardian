[project]
name = "ai-code-guardian"
version = "2.0.0"
description = "Repository-agnostic AI-powered application security platform: SAST, IaC, dependency, quantum-readiness, and business-intent analysis, with NVIDIA Nemotron reasoning."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "pandas", "openpyxl"]
ai = ["openai>=1.30", "sentence-transformers>=2.7", "faiss-cpu>=1.8", "requests>=2.31"]
dev = ["pytest>=7.0"]

[project.scripts]
guardian = "guardian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardian*"]
